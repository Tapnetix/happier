# Happier self-host stack (single box, light flavor).
#
#   - happier: the Happier server (SQLite + local files + embedded web UI at /).
#     No Postgres/Redis/S3 required. All state lives in the happier-data volume.
#   - caddy:   TLS-terminating reverse proxy (automatic Let's Encrypt certs).
#
# Usage:
#   cp deploy/selfhost/env.example .env.selfhost   # then edit it
#   chmod 600 .env.selfhost
#   docker compose --env-file .env.selfhost -f docker-compose.selfhost.yml up -d
#
# The --env-file flag is required: it drives both ${...} interpolation here and
# the server container's runtime environment (via env_file below).

name: happier-selfhost

services:
  happier:
    image: ${HAPPIER_IMAGE:-happierdev/relay-server:preview}
    # To build from THIS fork instead of the published image, comment out the
    # `image:` line above and uncomment this block (heavier: builds the monorepo):
    # build:
    #   context: .
    #   target: relay-server
    restart: unless-stopped
    env_file:
      - .env.selfhost
    environment:
      # Bind inside the container; only Caddy (same Docker network) reaches it.
      HAPPIER_SERVER_HOST: 0.0.0.0
      PORT: "3005"
      # Persist SQLite DB, uploaded files, and the master-secret file on the volume.
      HAPPIER_SERVER_LIGHT_DATA_DIR: /data
    volumes:
      - happier-data:/data
    expose:
      - "3005" # internal only — intentionally NOT published to the host
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3005/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      happier:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      HAPPIER_DOMAIN: ${HAPPIER_DOMAIN:?set HAPPIER_DOMAIN in .env.selfhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - internal

volumes:
  happier-data:
  caddy-data:
  caddy-config:

networks:
  internal:
